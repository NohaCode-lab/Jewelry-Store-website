name: Mangata & Gallo Production CI/CD & Security Pipeline

on:
  push:
    branches: [ main, upgrade/production-v2 ]
  pull_request:
    branches: [ main, upgrade/production-v2 ]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality-and-security:
    name: Quality Gate, Security Scanning & Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint --if-present

      - name: Run Vitest Unit Tests
        run: npm test --if-present

      - name: Build Production Bundle (TypeScript + Vite)
        run: npm run build --if-present

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend API Integration Tests
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm --prefix backend test --if-present

      - name: SonarCloud Scan
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mangatagallo-app:latest

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mangatagallo-app:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
