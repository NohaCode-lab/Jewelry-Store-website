name: Mangata & Gallo Production CI/CD & Security Pipeline

on:
  push:
    branches: [ main, upgrade/production-v2 ]
  pull_request:
    branches: [ main, upgrade/production-v2 ]

jobs:
  quality-and-security:
    name: Quality Gate, Security Scanning & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle (TypeScript + Vite)
        run: npm run build

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend API Integration Tests
        run: npm --prefix backend test

      - name: Build Production Docker Image
        run: docker build -t mangatagallo-app:latest .

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mangatagallo-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
