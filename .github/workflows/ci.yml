name: Mangata & Gallo Production CI/CD & Security Pipeline

on:
  push:
    branches: [ main, upgrade/production-v2 ]
  pull_request:
    branches: [ main, upgrade/production-v2 ]

jobs:
  quality-and-security:
    name: Quality Gate, Security Scanning & Docker Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Linter
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle (TypeScript + Vite)
        run: npm run build

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Backend API Integration Tests
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm --prefix backend test

      - name: Build Production Docker Image
        run: docker build -t mangatagallo-app:latest .

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: 'mangatagallo-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
