name: "Mangata and Gallo Production CI CD"

on:
  push:
    branches:
      - main
      - upgrade/production-v2
  pull_request:
    branches:
      - main
      - upgrade/production-v2

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Build, Test & Static Code Analysis
  # ---------------------------------------------------------------------------
  build-and-test:
    name: "Build Test and Quality Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: "Install Frontend Dependencies"
        run: npm ci

      - name: "Run ESLint Linter"
        run: npm run lint --if-present

      - name: "Run Vitest Unit Tests"
        run: npm test --if-present

      - name: "Build Production Bundle (TypeScript + Vite)"
        run: npm run build --if-present

      - name: "TypeScript Check"
        run: npx tsc --noEmit --if-present

      - name: "Install Backend Dependencies"
        working-directory: ./backend
        run: npm ci

      - name: "Generate Prisma Client"
        working-directory: ./backend
        run: npm run prisma:generate --if-present

      - name: "Run Backend Integration Tests"
        working-directory: ./backend
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm test --if-present
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # JOB 2: Docker Build & Trivy Security Vulnerability Scan
  # ---------------------------------------------------------------------------
  docker-and-security:
    name: "Docker Build and Trivy Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: "Build Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mangatagallo-app:latest

      - name: "Run Trivy Vulnerability Scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mangatagallo-app:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: "Upload Trivy SARIF report to GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
