name: "Mangata and Gallo Production CI CD"

on:
  push:
    branches:
      - main
      - upgrade/production-v2
  pull_request:
    branches:
      - main
      - upgrade/production-v2

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ===========================================================================
  # JOB 1: Frontend & Root Static Code Analysis, Linting & Unit Tests
  # ===========================================================================
  lint-and-unit-test:
    name: "1. Lint, Type-Check & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: "Install Frontend Dependencies"
        run: npm ci

      - name: "Run ESLint Linter"
        run: npm run lint

      - name: "TypeScript Strict Type Check"
        run: npx tsc --noEmit

      - name: "Run Vitest Frontend Unit Tests"
        run: npm test

      - name: "Build Production Bundle (Vite)"
        run: npm run build

  # ===========================================================================
  # JOB 2: Backend Integration & API Test Suite (Postgres & Redis Services)
  # ===========================================================================
  backend-integration-tests:
    name: "2. Backend Integration & Service Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mangatagallo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_2026
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d mangatagallo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Install Backend Dependencies"
        working-directory: ./backend
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      - name: "Generate Prisma Client"
        working-directory: ./backend
        run: npm run prisma:generate

      - name: "Push Database Schema to Test Postgres"
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:test_password_2026@127.0.0.1:5432/mangatagallo_test?schema=public"
        run: npx prisma db push

      - name: "Seed Database with Initial Test Data"
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:test_password_2026@127.0.0.1:5432/mangatagallo_test?schema=public"
        run: npm run prisma:seed

      - name: "Run Backend API Integration Tests"
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:test_password_2026@127.0.0.1:5432/mangatagallo_test?schema=public"
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm test

  # ===========================================================================
  # JOB 3: SonarCloud Code Quality & Vulnerability Analysis
  # ===========================================================================
  sonarcloud-analysis:
    name: "3. SonarCloud Quality Analysis"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # JOB 4: Docker Container Build & Trivy Security Vulnerability Scan
  # ===========================================================================
  docker-and-security:
    name: "4. Docker Build & Security Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests]
    env:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up QEMU for Architecture Support"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub (Conditional)"
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build Container Image (BuildKit Layer Caching)"
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mangatagallo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Run Trivy Security Vulnerability Scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mangatagallo-app:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: "Upload Trivy SARIF Report to GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ===========================================================================
  # JOB 5: Production Deployment Gate
  # ===========================================================================
  deploy-production:
    name: "5. Production Deployment Readiness Gate"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests, docker-and-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Execute Production Deployment"
        run: |
          echo "Production deployment initiated for commit SHA: ${{ github.sha }}"
          echo "Container Image Target: mangatagallo-app:latest"
