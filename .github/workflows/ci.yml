name: "Mangata and Gallo Production CI CD"

on:
  push:
    branches:
      - main
      - upgrade/production-v2
  pull_request:
    branches:
      - main
      - upgrade/production-v2

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ===========================================================================
  # JOB 1: Frontend & Root Static Code Analysis, Linting & Unit Tests
  # ===========================================================================
  lint-and-unit-test:
    name: "1. Lint, Type-Check & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: "Install Frontend Dependencies"
        run: npm ci

      - name: "Run ESLint Linter"
        run: npm run lint --if-present

      - name: "TypeScript Strict Type Check"
        run: npx tsc --noEmit --if-present

      - name: "Run Vitest Frontend Unit Tests"
        run: npm test --if-present

      - name: "Build Production Bundle (Vite)"
        run: npm run build --if-present

  # ===========================================================================
  # JOB 2: Backend Integration & API Test Suite (Redis Service Gated)
  # ===========================================================================
  backend-integration-tests:
    name: "2. Backend Integration & Service Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Install Backend Dependencies"
        working-directory: ./backend
        run: npm ci

      - name: "Generate Prisma Client"
        working-directory: ./backend
        run: npm run prisma:generate

      - name: "Run Backend API Integration Tests"
        working-directory: ./backend
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: npm test

  # ===========================================================================
  # JOB 3: SonarCloud Code Quality & Vulnerability Analysis
  # ===========================================================================
  sonarcloud-analysis:
    name: "3. SonarCloud Quality Analysis"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Run SonarCloud Scan"
        if: env.HAS_SONAR != ''
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          HAS_SONAR: ${{ secrets.SONAR_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # JOB 4: Docker Container Build & Trivy Security Vulnerability Scan
  # ===========================================================================
  docker-build-and-security:
    name: "4. Docker Build & Security Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Set up QEMU for Architecture Support"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub (Conditional)"
        if: env.HAS_DOCKER != ''
        uses: docker/login-action@v3
        env:
          HAS_DOCKER: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build Container Image (BuildKit Layer Caching)"
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mangatagallo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Run Trivy Security Vulnerability Scan"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mangatagallo-app:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: "Upload Trivy SARIF Report to GitHub Security Tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ===========================================================================
  # JOB 5: Production Deployment Gate
  # ===========================================================================
  deploy-production:
    name: "5. Production Deployment Gate"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-integration-tests, docker-build-and-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Execute Production Deployment"
        run: |
          echo "Production deployment initiated for commit SHA: ${{ github.sha }}"
          echo "Container Image Target: mangatagallo-app:latest"
