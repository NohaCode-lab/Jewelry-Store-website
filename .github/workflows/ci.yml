name: "Mangata and Gallo Production CI CD"

on:
  push:
    branches:
      - main
      - upgrade/production-v2
  pull_request:
    branches:
      - main
      - upgrade/production-v2

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ===========================================================================
  # JOB 1: Frontend & Root Static Code Analysis, Linting & Unit Tests
  # ===========================================================================
  lint-and-unit-test:
    name: "1. Lint, Type-Check & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: "Install Frontend Dependencies"
        run: npm ci

      - name: "Run ESLint Linter"
        run: npm run lint

      - name: "TypeScript Strict Type Check"
        run: npx tsc --noEmit

      - name: "Run Vitest Frontend Unit Tests"
        run: npm test

      - name: "Build Production Bundle (Vite)"
        run: npm run build

  # ===========================================================================
  # JOB 2: Backend Validation & API Tests
  # ===========================================================================
  backend-validation-and-tests:
    name: "2. Backend Quality & Service Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: "Install Backend Dependencies"
        working-directory: ./backend
        run: npm ci --include=dev

      - name: "Generate Prisma Client"
        working-directory: ./backend
        run: npm run prisma:generate

      - name: "Run Backend API Tests"
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: "test-secret-key-32-chars-minimum-length-for-ci"
        run: npm test

  # ===========================================================================
  # JOB 3: Docker Container Build Verification
  # ===========================================================================
  docker-build-verification:
    name: "3. Docker Container Build Verification"
    runs-on: ubuntu-latest
    needs: [lint-and-unit-test, backend-validation-and-tests]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Build Frontend & Backend Containers"
        run: |
          docker build -t mangatagallo-app:latest .
          echo "✅ Docker Container image successfully validated for production deployment"
